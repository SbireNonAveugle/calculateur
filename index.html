<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geocracy — Calculateur de craft</title>
  <meta name="description" content="Calculateur interactif pour Geocracy : hubs, seuils de boost, craft de soldats et défenseurs, plan de villes optimisé. 100 % statique, hors-ligne après premier chargement.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Typographies : Saira Condensed (titres) + IBM Plex Sans (données) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="css/style.css">

  <!-- Applique le thème sauvegardé AVANT le premier rendu (évite le flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("geocracy-calc:theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { /* stockage indisponible : thème clair par défaut */ }
    })();
  </script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Geocracy<span class="dot">·</span>Calc</div>
    <nav id="tabs" role="tablist" aria-label="Calculateurs"></nav>
    <button id="theme-toggle" type="button" aria-label="Changer de thème">☾</button>
  </div>

  <main id="view" aria-live="polite"></main>

  <noscript>
    <p style="max-width:940px;margin:20px auto;padding:0 16px">
      Ce calculateur nécessite JavaScript (aucune donnée n'est envoyée : tout se calcule dans ton navigateur).
    </p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
